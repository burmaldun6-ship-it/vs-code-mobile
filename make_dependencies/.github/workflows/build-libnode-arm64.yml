name: Build libnode Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'make_dependencies/**'

permissions:
  contents: read

env:
  NDK_VERSION: '21.4.7075529'
  ANDROID_API: '24'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout automation
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 git curl unzip zip

      - name: Download Android command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "ndk;${NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Clone Node.js Mobile
        run: git clone --depth 1 --branch mobile-master https://github.com/nodejs-mobile/nodejs-mobile.git make_dependencies/nodejs-mobile

      - name: Build libnode.so for arm64-v8a
        working-directory: make_dependencies/nodejs-mobile
        run: |
          chmod +x tools/android_build.sh
          ./tools/android_build.sh "$ANDROID_NDK_HOME" arm64
          test -s out_android/arm64-v8a/libnode.so
          file out_android/arm64-v8a/libnode.so

      - name: Package artifact
        run: |
          mkdir -p make_dependencies/artifact/arm64-v8a
          cp make_dependencies/nodejs-mobile/out_android/arm64-v8a/libnode.so make_dependencies/artifact/arm64-v8a/libnode.so

      - name: Upload libnode artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-android-arm64
          path: make_dependencies/artifact
          if-no-files-found: error
          retention-days: 30
