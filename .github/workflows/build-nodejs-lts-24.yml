name: Build upstream Node.js 24.19.0 for Android

on:
  workflow_dispatch:
    inputs:
      android_api:
        description: Android API level (24 or newer)
        required: true
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_VERSION: 24.19.0
      NDK_VERSION: 27.0.12077973
      ANDROID_API: ${{ inputs.android_api }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build upstream Node.js
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_upstream_24.sh
          scripts/build_upstream_24.sh

      - name: Locate ZIP
        id: package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$(find . -maxdepth 1 -type f -name 'libnode-upstream-24-arm64-api*.zip' -print -quit)"
          if [[ -z "$zip_path" ]]; then
            echo "ZIP artifact not found" >&2
            exit 1
          fi
          sha_path="${zip_path}.sha256"
          test -f "$sha_path"
          printf 'zip=%s\n' "$zip_path" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha_path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libnode-upstream-24-arm64-api${{ inputs.android_api }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-upstream-node-24
          path: work/logs/
          retention-days: 14
          if-no-files-found: warn
