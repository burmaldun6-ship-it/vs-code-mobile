name: Build libnode Android ARM64

on:
  push:
    paths:
      - make_dependencies/**
      - .github/workflows/build-libnode-arm64.yml
  workflow_dispatch:
    inputs:
      node_version:
        description: Full Node.js version or lts
        required: false
        default: lts
      android_api:
        description: Android API level (minimum 24)
        required: false
        default: '24'

permissions:
  contents: read

env:
  NODE_VERSION_REQUEST: ${{ inputs.node_version || 'lts' }}
  ANDROID_API: ${{ inputs.android_api || '24' }}
  NDK_VERSION: '27.3.13750724'
  MOBILE_TOOLS_COMMIT: 'd9552e0e01ed5bdbe12a31d1ce6c0877a4f39580'
  CMDLINE_TOOLS_SHA256: '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258'

jobs:
  build:
    name: Android ARM64 libnode
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential python3 git curl unzip zip xz-utils file binutils ca-certificates
          python3 --version
          java -version
          gcc --version
          make --version

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          CMDLINE_ZIP=/tmp/commandlinetools-linux.zip
          mkdir -p "$SDK/cmdline-tools"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$CMDLINE_ZIP" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          printf '%s  %s\n' "$CMDLINE_TOOLS_SHA256" "$CMDLINE_ZIP" | sha256sum -c -
          unzip -q "$CMDLINE_ZIP" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-${ANDROID_API}" "ndk;${NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -x "$SDK/ndk/${NDK_VERSION}/ndk-build"
          "$SDK/ndk/${NDK_VERSION}/ndk-build" --version

      - name: Static-check build script
        shell: bash
        run: |
          set -euo pipefail
          bash -n make_dependencies/build_android_arm64.sh

      - name: Build libnode
        shell: bash
        env:
          LDFLAGS: '-Wl,-z,max-page-size=16384'
        run: |
          set -euo pipefail
          chmod +x make_dependencies/build_android_arm64.sh
          make_dependencies/build_android_arm64.sh

      - name: Upload build ZIP
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: libnode-android-arm64
          path: |
            libnode-android-arm64-*.zip
            libnode-android-arm64-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libnode-android-arm64-logs
          path: |
            make_dependencies/logs
            make_dependencies/work/source/SHASUMS256.txt
          if-no-files-found: warn
          retention-days: 14
